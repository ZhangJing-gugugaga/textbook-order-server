spring:
  application:
    name: textbook-order-server
  # 必填：不提供默认 profile。历史上默认 local 会在生产漏设环境变量时执行
  # db/schema.sql + data-seed.sql，向生产库写入 18 个已知口令的测试账号（含超管）。
  # 缺失即由 StartupSelfCheck 断言失败，启动中止（fail-fast）。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:}
  # JSON 序列化：时间统一 Asia/Shanghai
  # 注意：date-format 只作用于 java.util.Date，**不影响** JSR-310（LocalDateTime 出参恒为
  # ISO-8601，入参的宽容解析见 TimeFormatConfig / TimeFormats），不要以为改这里能改接口时间口径。
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  # 数据源：连接串经环境变量注入（SPEC §13，不硬编码）
  datasource:
    url: ${DB_URL:jdbc:mysql:<SECRET_824596b7>}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: TextbookHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000
  # schema.sql 为初始化脚本（部署手册交付物）；默认不自动执行，local profile 自动建库
  sql:
    init:
      mode: never
  # 刻意不配 spring.mvc.format.date-time：它只覆盖 MVC 参数绑定（body 不受影响），
  # 会让 query 与 body 的时间口径分叉。时间入参统一由 TimeFormatConfig 的转换器接管
  # （ISO-8601 与 yyyy-MM-dd HH:mm:ss 都接受，出参恒为 ISO-8601）。
  # 文件上传上限由 UploadConfig 程序化配置（容器 100MB 兜底 + import.max_file_mb 业务校验）。
  # 优雅停机：停止接收新请求后，等待在途请求与异步任务收尾的宽限期
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8080}
  # Nginx 反代 /api/ → 8080/api/（SPEC §15），context-path 保持为空，接口自带 /api 前缀
  error:
    include-message: never
    include-stacktrace: never
  # 优雅停机（默认 immediate 会硬切在途请求）
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:200}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 逻辑删除由各服务显式处理（deleted=0 过滤 + 删除写时间戳，W9），不开启 MP 逻辑删除
  global-config:
    banner: false

# 健康检查（P3）：仅暴露 health（存活/就绪），不暴露 env/beans/heapdump 等信息端点。
# 探针：/actuator/health（就绪）与 /actuator/health/liveness、/actuator/health/readiness
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    # 数据源与磁盘空间参与健康判定（磁盘不足是导出/导入失败的首要原因）
    db:
      enabled: true
    diskspace:
      enabled: true

springdoc:
  # OpenAPI 为唯一契约源（W12），但生产不得暴露：默认关闭，仅 local 显式开启。
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
  default-produces-media-type: application/json

# 业务配置（SPEC §13 application-{env}.yml 主要键）
textbook:
  security:
    login:
      max-fail: 5            # 登录失败 5 次锁定（W20）
      lock-minutes: 15       # 锁定 15 分钟
  jwt:
    # 必填：无默认值（缺失即启动失败，见 StartupSelfCheck）。
    # 历史默认值 textbook-dev-only-insecure-secret-key-32b 是仓库公开字符串，
    # 用它签发/校验令牌等于任何人可离线伪造超管 token（认证绕过）。
    secret: ${JWT_SECRET:}
    access-minutes: 15       # access 15 分钟
    refresh-days: 7          # refresh 7 天
  cors:
    # 跨域来源白名单（逗号分隔，完整 origin，如 https://moonzj.com）。
    # 默认空 = 不返回任何 CORS 头（Web 走 Nginx 同域反代，小程序端不受 CORS 约束）。
    allowed-origins: ${TEXTBOOK_CORS_ORIGINS:}
  import:
    max-file-mb: 10          # 上传上限（与 system_config.import.max_file_mb 对应）
    pool:
      core-size: 2           # 专用线程池：核心 2 / 最大 4 / 队列 50
      max-size: 4
      queue-capacity: 50
  export:
    tmp-dir: ${TEXTBOOK_EXPORT_TMP:./data/export}
    sync-row-threshold: 5000 # 预估行数 > 5000 走异步任务（Q16）
    download-token-minutes: 10
    retention-hours: 24      # 导出文件保留 24 小时（同时约束下载与错误明细文件）
  async:
    # 启动时回收上次进程遗留的 running/queued 任务（默认开）。
    # 多实例（滚动发布）必须置 false：新实例会把旧实例正在执行的任务误判为遗留。
    recover-on-startup: ${TEXTBOOK_ASYNC_RECOVER:true}
  weixin:
    miniapp:
      appid: ${WX_MINIAPP_APPID:}
      secret: ${WX_MINIAPP_SECRET:}
      subscribe-template-id: ${WX_SUBSCRIBE_TEMPLATE_ID:}

logging:
  # 日志格式/轮转统一由 logback-spring.xml 定义（含 %X{traceId} 链路标识）。
  # 此处不再声明 logging.pattern.console：它会被 logback-spring.xml 的 pattern 覆盖，
  # 是死配置，留着只会误导「改这里就能改日志格式」。
  level:
    root: INFO
    com.tian.textbook: ${LOG_LEVEL_APP:INFO}
