# 移交学校环境：与试运行同拓扑（改 env 与 Nginx，不改代码）
spring:
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

textbook:
  jwt:
    # 无默认值：未注入 JWT_SECRET 时占位符解析失败，启动即中止（绝不回落到仓库内公开密钥）
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${TEXTBOOK_CORS_ORIGINS:}

logging:
  level:
    com.tian.textbook: INFO
